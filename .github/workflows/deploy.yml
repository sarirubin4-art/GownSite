name: Deploy to Azure

on:
  push:
    branches: [ master ]
  workflow_dispatch: {}

env:
  AZURE_WEBAPP_NAME: regowned
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # dotnet publish triggers the PublishRunWebpack target in GownSite.Web.csproj,
      # which runs `npm install` + `npm run build` and copies the built SPA into wwwroot.
      - name: Publish
        run: dotnet publish GownSite.Web/GownSite.Web.csproj -c Release -r linux-x64 --self-contained false -o ${{ github.workspace }}/publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish
